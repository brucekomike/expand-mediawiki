name: Build and Push Container Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'Dockerfile*'
      - '.github/workflows/build-container.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile*'
      - '.github/workflows/build-container.yml'
  schedule:
    - cron: '0 0 * * 0'

env:
  REGISTRY: ghcr.io

concurrency:
  group: build-container-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-dockerfiles:
    name: Detect Dockerfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Find Dockerfiles to build
        id: find
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          add_file() {
            case " $selected " in
              *" $1 "*) ;;
              *) selected="$selected $1" ;;
            esac
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA:refs/remotes/origin/pr-base"
            changed_files=$(git diff --name-only --diff-filter=d origin/pr-base HEAD | sort -u)
            selected=""

            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                Dockerfile)
                  add_file Dockerfile
                  add_file Dockerfile.slim
                  add_file Dockerfile.fpm
                  add_file Dockerfile.fpm-slim
                  ;;
                Dockerfile.fpm)
                  add_file Dockerfile.fpm
                  add_file Dockerfile.fpm-slim
                  ;;
                Dockerfile.slim)
                  add_file Dockerfile.slim
                  ;;
                Dockerfile.fpm-slim)
                  add_file Dockerfile.fpm-slim
                  ;;
                .github/workflows/build-container.yml)
                  add_file Dockerfile
                  add_file Dockerfile.slim
                  add_file Dockerfile.fpm
                  add_file Dockerfile.fpm-slim
                  ;;
              esac
            done < <(printf '%s\n' "$changed_files")

            files=$(printf '%s\n' $selected | sed '/^$/d' | sort -u)
          else
            files=$(find . -type f -name "Dockerfile*" -not -path "./.git/*" | sed 's|^\./||' | sort)
          fi

          if [ -z "$files" ]; then
            echo "No Dockerfiles selected for this run."
          fi

          matrix=$(printf '%s\n' "$files" | \
            jq -Rsc '[
              split("\n")[] | select(length > 0) | . as $f |
              (. | split("/")[-1]) as $name |
              (if $name == "Dockerfile" then "" else "-" + ($name | ltrimstr("Dockerfile.")) end) as $suffix |
              (if $name == "Dockerfile.slim" then "expand-mediawiki:local"
               elif $name == "Dockerfile.fpm" then "expand-mediawiki:local"
               elif $name == "Dockerfile.fpm-slim" then "expand-mediawiki-fpm:local"
               else "" end) as $source_image |
              {"dockerfile": $f, "suffix": $suffix, "source_image": $source_image}
            ] | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and Push (${{ github.repository }}${{ matrix.suffix }})
    needs: detect-dockerfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-dockerfiles.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local expand-mediawiki base image
        if: matrix.dockerfile != 'Dockerfile'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: expand-mediawiki:local
          cache-from: type=gha,scope=${{ github.repository }}

      - name: Build local expand-mediawiki fpm image
        if: matrix.dockerfile == 'Dockerfile.fpm-slim'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fpm
          load: true
          tags: expand-mediawiki-fpm:local
          build-args: |
            SOURCE_IMAGE=expand-mediawiki:local
          cache-from: type=gha,scope=${{ github.repository }}-fpm

      - name: Build and push standalone container image
        if: matrix.source_image == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.repository }}${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ github.repository }}${{ matrix.suffix }},mode=max

      - name: Build and push dependent container image
        if: matrix.source_image != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            SOURCE_IMAGE=${{ matrix.source_image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.repository }}${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ github.repository }}${{ matrix.suffix }},mode=max